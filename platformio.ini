[platformio]
src_dir = src/game       ; Arduino sketch lives under src/game

[env:trellis_m4]
platform = atmelsam
board = adafruit_trellis_m4
framework = arduino
build_flags =
  -D USE_TINYUSB
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
  adafruit/Adafruit NeoTrellis M4 Library
  adafruit/Adafruit NeoPixel
